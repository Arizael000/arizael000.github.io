name: Refresh operational dashboard cache

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: operational-dashboard-cache
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out default branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run cache processor tests
        run: python -m unittest discover -s tests -t .

      - name: Fetch and aggregate public-sheet data
        env:
          GOOGLE_SHEETS_API_KEY: ${{ secrets.GOOGLE_SHEETS_API_KEY }}
        run: python scripts/build_reporte_documental_cache.py

      - name: Commit changed aggregate cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reporte-documental.json
          if git diff --cached --quiet; then
            echo "Aggregate cache is unchanged."
          else
            git commit -m "Refresh operational dashboard cache"
            git push
          fi
